[project]
name = "decision-twin"
version = "0.1.0"
description = "A model that decides like its owner and directs a separate worker agent"
requires-python = ">=3.12"
dependencies = [
  "openai==3.42.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# /tmp appears as data: paths an agent might touch, not files we create
"guardian/*" = ["S108"]
"tests/*" = ["S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
